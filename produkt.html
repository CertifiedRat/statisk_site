<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="general.css" />
    <title>Produkter</title>
  </head>

  <body>
    <header>
      <nav class="header-content">
        <div class="logo">
          <a href="index.html"> <img src="imgs/logo.png" alt="placeholder logo" /></a>
        </div>
        <button class="menuikon" aria-label="open mobile menu">
          <span class="topline"></span>
          <span class="middleline"></span>
          <span class="bottomline"></span>
        </button>
        <ul class="menu">
          <li><a href="produktliste.html">Produkter</a></li>
          <li><a href="produktliste.html">Sæsoner</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section-container no-gap">
        <div class="breadcrumbs">
          <a href="/">Home &nbsp;&#8250;&nbsp;&nbsp;</a>
          <a href="produktliste.html"> New Arrivals &nbsp;&#8250;&nbsp;&nbsp;</a>
          <a href="produktliste.html"> Window Cats &nbsp;&#8250;&nbsp;&nbsp;</a>
          <p class="current">Chonk</p>
        </div>

        <div class="product-container">
          <div class="product-imgs discount">
            <div class="product-imgs-options">
              <img src="imgs/cookoo.JPG" alt="placeholder" />
              <img src="imgs/chonk.JPG" alt="placeholder" />
              <img src="imgs/kawaii.JPG" alt="placeholder" />
              <img src="imgs/eepy.JPG" alt="placeholder" />
            </div>
            <img src="imgs/cookoo.JPG" alt="placeholder" />
            <p class="discount-tag">37,24%</p>
          </div>

          <div class="product-info soldout discount">
            <h2>Product Name</h2>
            <p>Short description of the product</p>
            <div class="color-options">
              <p><strong>Color:</strong> Black & White</p>
              <a href="produkt.html"> <img src="imgs/chonk.JPG" alt="placeholder" /></a>
              <a href="produkt.html"> <img src="imgs/eepy.JPG" alt="placeholder" /></a>
              <a href="produkt.html"> <img src="imgs/kawaii.JPG" alt="placeholder" /></a>
            </div>
            <div class="prices">
              <p class="price">2,39 kr</p>
              <p class="new-price"><strong>1,50 kr</strong></p>
            </div>
            <label for="sizes"><strong>Size:</strong></label>
            <select name="sizes" id="sizes">
              <option value="choose">Choose a size</option>
              <option value="small">Itty bitty</option>
              <option value="medium">Surprisingly average</option>
              <option value="large">Humongous</option>
            </select>
            <a href="produkt.html" class="add-to-basket">Add to basket</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <nav class="footer-content">
        <div class="logo">
          <a href="index.html"> <img src="imgs/logo.png" alt="placeholder logo" /></a>
        </div>
        <ul>
          <li>
            <p><strong>Vores sider</strong></p>
          </li>
          <li><a href="produktliste.html">Produkter</a></li>
          <li><a href="produktliste.html">Sæsoner</a></li>
        </ul>
      </nav>
    </footer>
    <script src="menu.js"></script>
    <script src="slider.js"></script>
